name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Run the phase-1 self-check
        id: check
        run: |
          set +e
          ./run_test.sh ci
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Build job summary
        if: always()
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          summary_path = Path("results/ci.txt")
          step_summary = os.environ["GITHUB_STEP_SUMMARY"]

          if not summary_path.exists():
              with open(step_summary, "a") as f:
                  f.write(
                      "# 🔴 Phase 1 self-check — crashed before producing a summary\n\n"
                      "See the **Run the phase-1 self-check** step's log for the "
                      "traceback (likely a missing RARS jar or a Java problem).\n"
                  )
              print("::error::self-check crashed before writing results/ci.txt")
              raise SystemExit(0)

          rows = []
          for line in summary_path.read_text().splitlines():
              m = re.match(r"^(PASS|FAIL)\s+(.*)$", line)
              if not m:
                  continue
              status, rest = m.groups()
              label, _, reason = rest.partition("  --  ")
              label = re.sub(r"\s+", " ", label.strip())
              rows.append((status, label, reason.strip()))

          total = len(rows)
          passed = sum(1 for status, _, _ in rows if status == "PASS")
          emoji = "🟢" if total and passed == total else "🔴"

          lines = [f"# {emoji} Phase 1 self-check — {passed}/{total} passing", ""]

          for title, prefix in (("Assembly", "Assembly:"), ("Assembler", "Assembler:")):
              items = [r for r in rows if r[1].startswith(prefix)]
              if not items:
                  continue
              lines += [f"### {title}", "", "| | Check | Notes |", "|---|---|---|"]
              for status, label, reason in items:
                  icon = "✅" if status == "PASS" else "❌"
                  lines.append(f"| {icon} | `{label}` | {reason} |")
              lines.append("")

          lines += [
              "> This is a self-check, not the graded run: it covers configuration 1 "
              "only, and the real Gradescope autograder also runs configurations 2 and 3.",
              "",
              "Full spliced programs, RARS memory dumps and your assembler's "
              "generated files are attached below as the `self-check-output` artifact.",
          ]

          with open(step_summary, "a") as f:
              f.write("\n".join(lines) + "\n")

          name_re = re.compile(r"^(Assembly|Assembler):\s+(\S+)")
          for status, label, reason in rows:
              if status != "PASS":
                  m = name_re.match(label)
                  target = (
                      f"{m.group(2)}.s" if m and m.group(1) == "Assembly" else "assembler.py"
                  )
                  print(f"::error file={target},title={label}::{reason or 'check failed'}")

          print(f"::notice title=Phase 1 self-check::{passed}/{total} passing")

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: self-check-output
          path: |
            results/
            output/
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail the job if any check failed
        if: steps.check.outputs.status != '0'
        run: exit 1
